<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DRBL Live</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="extension-popup">
  <div class="app">
    <header class="chrome liquid-glass">
      <a href="https://drbl.io" target="_blank" rel="noopener noreferrer" class="brand" title="Open DRBL">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path class="arc-outer" d="M10 6.5c7.2 0 13 5.8 13 13" stroke-width="2.4" stroke-linecap="round"/><path class="arc-inner" d="M10 11c4.7 0 8.5 3.8 8.5 8.5" stroke-width="1.7" stroke-linecap="round"/><path class="spine" d="M10 6.5v13" stroke-width="2.4" stroke-linecap="round"/><circle class="ball" cx="22.5" cy="19.2" r="2.35"/></svg>
        </span>
        <span class="brand-word">DRBL</span>
      </a>
      <div class="chrome-actions">
        <span class="feed-pill" id="feed-indicator" title="Not connected">
          <span class="status-dot"></span>
          <span id="feed-label">Connecting</span>
        </span>
        <button type="button" class="icon-btn" id="refresh" title="Refresh scores" aria-label="Refresh scores">↻</button>
        <button type="button" class="icon-btn" data-open-options title="Settings" aria-label="Settings">⚙</button>
      </div>
    </header>

    <main class="popup-main">
      <span class="brand-atmosphere" aria-hidden="true">
        <span class="brand-orb brand-orb--blue"></span>
        <span class="brand-orb brand-orb--red"></span>
      </span>
      <div class="popup-main-inner">
        <div class="page-head">
          <div>
            <h1 class="type-page">Scores</h1>
            <p class="type-caption muted">Same board as drbl.io/scores.</p>
          </div>
          <a href="https://drbl.io/scores" target="_blank" rel="noopener noreferrer" class="text-link">All scores ↗</a>
        </div>

        <div class="filter-row" role="group" aria-label="Game filters">
          <button type="button" class="glass-pill filter active" data-filter="all" aria-pressed="true">All</button>
          <button type="button" class="glass-pill filter" data-filter="live" aria-pressed="false">Live <span class="count" id="live-count">0</span></button>
          <button type="button" class="glass-pill filter" data-filter="favorites" aria-pressed="false">Favorites</button>
        </div>

        <div class="feedback" id="feedback" hidden role="status"></div>

        <section class="board-section" id="live-section" hidden>
          <div class="section-head">
            <h2 class="type-heading"><span class="live-ping" aria-hidden="true"></span> Live</h2>
            <span class="type-caption muted" id="live-meta"></span>
          </div>
          <div class="tile-grid" id="live-games"></div>
        </section>

        <section class="board-section" id="today-section" hidden>
          <div class="section-head">
            <h2 class="type-heading">Today</h2>
            <span class="type-caption muted" id="today-meta"></span>
          </div>
          <div class="tile-grid" id="today-games"></div>
        </section>

        <section class="board-section" id="upcoming-section" hidden>
          <div class="section-head">
            <h2 class="type-heading">Up next</h2>
            <span class="type-caption muted" id="upcoming-meta"></span>
          </div>
          <div class="tile-grid" id="upcoming-games"></div>
        </section>

        <div class="empty-state" id="empty-state" hidden>
          <strong id="empty-title">No games found</strong>
          <span id="empty-text"></span>
          <button type="button" id="open-settings" class="glass-pill empty-action">Choose favorite teams</button>
        </div>
      </div>
    </main>

    <footer class="chrome footer liquid-glass">
      <span id="updated">Waiting for first sync</span>
      <span class="footer-links">
        <a href="https://drbl.io" target="_blank" rel="noopener noreferrer">drbl.io ↗</a>
        <a href="#" data-open-options>Settings</a>
      </span>
    </footer>
  </div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
