<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DRBL Live preview</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    html, body { width: 1280px; height: 800px; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      margin: 0;
      background: #dfe3eb;
    }
    .frame {
      width: 380px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgb(0 0 0 / 0.16), 0 2px 8px rgb(0 0 0 / 0.06);
      border: 1px solid rgb(0 0 0 / 0.06);
      background: var(--background);
    }
    body.dark-shot {
      background: #0a0b0f;
    }
  </style>
</head>
<body>
  <div class="frame extension-popup">
    <div class="app">
      <header class="chrome liquid-glass">
        <a class="brand" href="#">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none"><path class="arc-outer" d="M10 6.5c7.2 0 13 5.8 13 13" stroke-width="2.4" stroke-linecap="round"/><path class="arc-inner" d="M10 11c4.7 0 8.5 3.8 8.5 8.5" stroke-width="1.7" stroke-linecap="round"/><path class="spine" d="M10 6.5v13" stroke-width="2.4" stroke-linecap="round"/><circle class="ball" cx="22.5" cy="19.2" r="2.35"/></svg>
          </span>
          <span class="brand-word">DRBL</span>
        </a>
        <div class="chrome-actions">
          <span class="feed-pill"><span class="status-dot"></span><span>Connected</span></span>
          <span class="icon-btn" aria-hidden="true">↻</span>
          <span class="icon-btn" aria-hidden="true">⚙</span>
        </div>
      </header>
      <main class="popup-main">
        <span class="brand-atmosphere" aria-hidden="true">
          <span class="brand-orb brand-orb--blue"></span>
          <span class="brand-orb brand-orb--red"></span>
        </span>
        <div class="popup-main-inner">
          <div class="page-head">
            <div>
              <h1 class="type-page">Scores</h1>
              <p class="type-caption muted">Same board as drbl.io/scores.</p>
            </div>
            <span class="text-link">All scores ↗</span>
          </div>
          <div class="filter-row">
            <button class="glass-pill filter">All</button>
            <button class="glass-pill filter active">Live <span class="count">2</span></button>
            <button class="glass-pill filter">Favorites</button>
          </div>
          <section class="board-section">
            <div class="section-head">
              <h2 class="type-heading"><span class="live-ping"></span> Live</h2>
              <span class="type-caption muted">2 games</span>
            </div>
            <div class="tile-grid" id="games"></div>
          </section>
        </div>
      </main>
      <footer class="chrome footer liquid-glass">
        <span>Updated 8:42 PM</span>
        <span class="footer-links"><span>drbl.io ↗</span><span>Settings</span></span>
      </footer>
    </div>
  </div>
  <script>
    const WASH = {
      BOS:'#007A33',LAL:'#552583',NYK:'#006BB6',PHI:'#006BB6',
      OKC:'#007AC1',DEN:'#0E2240',GSW:'#1D428A',MIA:'#98002E',
    };
    const SLUG = {
      BOS:'bos',LAL:'lal',NYK:'ny',PHI:'phi',
      OKC:'okc',DEN:'den',GSW:'gs',MIA:'mia',
    };
    const NICK = {
      BOS:'Celtics',LAL:'Lakers',NYK:'Knicks',PHI:'76ers',
      OKC:'Thunder',DEN:'Nuggets',GSW:'Warriors',MIA:'Heat',
    };
    const logo = (a) => `https://a.espncdn.com/i/teamlogos/nba/500/${SLUG[a]}.png`;
    const head = (id) => `https://a.espncdn.com/i/headshots/nba/players/full/${id}.png`;

    const LIGHT = [
      {
        away:'BOS',home:'LAL',awayScore:112,homeScore:108,clock:'Q4 · 2:18',
        awayRec:'5-1',homeRec:'4-2',
        // Tatum, Paul George · Luka, Austin Reaves
        awayIds:['4065648','4251'], homeIds:['3945274','4066457'],
      },
      {
        away:'NYK',home:'PHI',awayScore:99,homeScore:101,clock:'Q3 · 5:41',
        awayRec:'5-0',homeRec:'3-3',
        // Brunson, KAT · Embiid, LeBron
        awayIds:['3934672','3136195'], homeIds:['3059318','1966'],
      },
    ];

    const DARK = [
      {
        away:'OKC',home:'DEN',awayScore:118,homeScore:114,clock:'Q4 · 1:06',
        awayRec:'6-0',homeRec:'4-2',
        // SGA, Jalen Williams · Jokic, Jamal Murray
        awayIds:['4278073','4593803'], homeIds:['3112335','3936299'],
      },
      {
        away:'GSW',home:'MIA',awayScore:105,homeScore:109,clock:'Q4 · 4:33',
        awayRec:'3-3',homeRec:'4-2',
        // Curry, Draymond · Giannis, Bam
        awayIds:['3975','6589'], homeIds:['3032977','4066261'],
      },
    ];

    const params = new URLSearchParams(location.search);
    const dark = params.get('theme') === 'dark';
    if (dark) {
      document.documentElement.dataset.theme = 'dark';
      document.documentElement.classList.add('dark');
      document.body.classList.add('dark-shot');
    }
    const games = dark ? DARK : LIGHT;

    function stack(ids) {
      return `<div class="headshot-stack">${ids.map((id)=>`<span class="headshot-chip"><img class="headshot" src="${head(id)}" width="22" height="22" alt=""></span>`).join('')}</div>`;
    }
    function row(abbr, rec, score, lead) {
      return `
        <img class="team-mark" src="${logo(abbr)}" width="28" height="28" alt="">
        <div class="team-identity"><span class="team-name">${NICK[abbr]}</span><span class="team-record">${rec}</span></div>
        <span class="score-cell"><span class="team-score ${lead?'is-leading':''}">${score}</span><span class="win-marker is-hidden"></span></span>`;
    }
    const list = document.getElementById('games');
    games.forEach((g, i) => {
      const card = document.createElement('article');
      card.className = 'sports-card score-tile is-live is-in';
      card.dataset.motion = 'card';
      card.style.setProperty('--i', String(i));
      card.innerHTML = `
        <span class="strip-orbs" aria-hidden="true">
          <span class="strip-orb" style="left:-60px;top:2px;--orb-color:${WASH[g.away]};--orb-strength:0.8"></span>
          <span class="strip-orb strip-orb--b" style="right:-60px;bottom:-16px;--orb-color:${WASH[g.home]};--orb-strength:0.8"></span>
          <span class="matchup-rim" style="--rim-away:${WASH[g.away]};--rim-home:${WASH[g.home]}"></span>
        </span>
        <div class="tile-body">
          <div class="status-row">
            <span class="status-line">
              <span class="live-indicator"><span class="live-ping"></span><span>LIVE</span></span>
              <span class="status-clock">${g.clock}</span>
            </span>
          </div>
          <div class="team-rows">
            ${row(g.away, g.awayRec, g.awayScore, g.awayScore>g.homeScore)}
            ${row(g.home, g.homeRec, g.homeScore, g.homeScore>g.awayScore)}
          </div>
          <div class="tile-footer">
            <div class="starter-side"><span class="starter-label">${g.away}</span>${stack(g.awayIds)}</div>
            <div class="starter-side starter-side--home">${stack(g.homeIds)}<span class="starter-label">${g.home}</span></div>
          </div>
        </div>`;
      list.append(card);
    });
  </script>
</body>
</html>
