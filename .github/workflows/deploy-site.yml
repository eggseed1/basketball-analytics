name: Deploy site

# Code-only ship to Cloudflare. Bakes whatever is already on the branch —
# no daily sync, DRBL refit, Playwright, or data commits.
# Nightly data + deploy stays on daily-runtime-refresh.yml.

on:
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Feature-branch / code-only ships must not regress season progress.
      # Nightly + the home stats runner land these on main with [skip ci].
      # Without this sync, a branch deploy freezes opening-night W-L / GP while
      # main has already moved on (same class of bug as the Explore board).
      - name: Sync season-progress snapshots from main
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- \
            src/data/runtime/season-tables-snapshot.json \
            src/data/runtime/nba-espn-player-ids.json \
            src/data/runtime/season-tables-meta.json \
            public/runtime/season-tables-meta.json \
            src/data/runtime/standings-snapshot.json \
            src/data/runtime/team-board-snapshot.json \
            src/data/runtime/game-snapshot.json \
            src/data/runtime/current-roster-snapshot.json \
            src/data/runtime/recent-insights-snapshot.json \
            src/data/runtime/stat-detective-windows.json \
            src/data/runtime/drbl-overlay-snapshot.json \
            public/runtime/drbl-overlay-snapshot.json \
            src/data/runtime/drbl-published-seasons.json \
            src/data/runtime/drbl-guide-snapshot.json \
            src/data/runtime/impact-overlay-snapshot.json \
            src/data/runtime/percentile-pools-snapshot.json \
            public/runtime/percentile-pools-snapshot.json \
            2>/dev/null || true
          if [ ! -f src/data/runtime/season-tables-meta.json ] && [ -f src/data/runtime/season-tables-snapshot.json ]; then
            node --input-type=module -e "
              import fs from 'node:fs';
              const t = JSON.parse(fs.readFileSync('src/data/runtime/season-tables-snapshot.json','utf8'));
              const body = JSON.stringify({ generatedAt: t.generatedAt ?? null, source: t.source ?? 'stats.nba.com' }) + '\n';
              fs.writeFileSync('src/data/runtime/season-tables-meta.json', body);
              fs.mkdirSync('public/runtime', { recursive: true });
              fs.writeFileSync('public/runtime/season-tables-meta.json', body);
            "
          fi
          node --require ./scripts/lib/stub-server-only.cjs --import tsx \
            scripts/build-explore-players-first-page.ts

      - name: Build OpenNext bundle
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing deploy token::The CLOUDFLARE_API_TOKEN repo secret is empty. Set it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          set -o pipefail
          npx opennextjs-cloudflare deploy 2>&1 | tee /tmp/deploy.log

      - name: Check Worker size
        if: always()
        run: |
          [ -f /tmp/deploy.log ] || exit 0
          kib=$(grep -oE 'Total Upload: [0-9.]+ KiB' /tmp/deploy.log | head -1 | grep -oE '[0-9.]+' || true)
          [ -n "$kib" ] || exit 0
          echo "Worker upload: ${kib} KiB of 65536 KiB"
          if awk -v k="$kib" 'BEGIN { exit !(k > 64512) }'; then
            echo "::error title=Worker bundle near the 64 MiB limit::Upload is ${kib} KiB; Cloudflare rejects uploads above 65536 KiB. Move large bundled JSON to static assets or R2."
            exit 1
          fi
          if awk -v k="$kib" 'BEGIN { exit !(k > 61440) }'; then
            echo "::warning title=Worker bundle size::Upload is ${kib} KiB (soft ceiling 61440 KiB). Still under Cloudflare's 65536 KiB hard limit."
          fi

      # PAGE_CACHE keys include CF_VERSION_METADATA.id, so every ship starts cold.
      # Warm the routes users hit first; otherwise the whole site feels slow until traffic refills KV.
      - name: Warm PAGE_CACHE
        if: success()
        run: |
          set -euo pipefail
          paths=("/" "/standings" "/scores" "/explore/games" "/explore/players" "/explore/teams" "/ask")
          if games=$(curl -fsS --max-time 15 \
            "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard" \
            | node -e '
              let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{
                try {
                  const d=JSON.parse(s);
                  for (const e of d.events||[]) {
                    const st=e.competitions?.[0]?.status?.type?.state;
                    if (st==="in"||st==="post") console.log("/games/"+e.id);
                  }
                } catch {}
              });
            '); then
            while IFS= read -r g; do
              [ -n "$g" ] && paths+=("$g")
            done <<< "$games"
          fi
          echo "Warming ${#paths[@]} paths on https://drbl.io"
          for path in "${paths[@]}"; do
            code=$(curl -sS -o /dev/null -w "%{http_code} %{time_total}" \
              --max-time 90 \
              -H "Accept: text/html" \
              -H "User-Agent: drbl-deploy-cache-warm" \
              "https://drbl.io${path}" || echo "ERR 0")
            echo "  ${path} → ${code}"
          done

      - name: Summary
        if: always()
        run: |
          echo "### Deploy site (code only)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- ref: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- no daily sync / data refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "- PAGE_CACHE warm after deploy" >> "$GITHUB_STEP_SUMMARY"
