name: Deploy site

# Code ship to Cloudflare. No daily sync / DRBL refit / data commits.
# Still rebakes gitignored current-season Static Assets (player game logs +
# shot charts): OpenNext replaces the Worker asset tree on every deploy, so a
# bare ship would wipe those until the next nightly refresh.
# Play-by-play JSON is also gitignored but served from GAME_ARCHIVE R2 (and
# live ESPN for in-progress games), so it is not rebaked here.
# Nightly data + deploy stays on daily-runtime-refresh.yml.

on:
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Bake current-season edge runtime assets
        run: node scripts/bake-deploy-runtime-assets.mjs

      - name: Build OpenNext bundle
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing deploy token::The CLOUDFLARE_API_TOKEN repo secret is empty. Set it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          set -o pipefail
          npx opennextjs-cloudflare deploy 2>&1 | tee /tmp/deploy.log

      - name: Check Worker size
        if: always()
        run: |
          [ -f /tmp/deploy.log ] || exit 0
          kib=$(grep -oE 'Total Upload: [0-9.]+ KiB' /tmp/deploy.log | head -1 | grep -oE '[0-9.]+' || true)
          [ -n "$kib" ] || exit 0
          echo "Worker upload: ${kib} KiB of 65536 KiB"
          if awk -v k="$kib" 'BEGIN { exit !(k > 64512) }'; then
            echo "::error title=Worker bundle near the 64 MiB limit::Upload is ${kib} KiB; Cloudflare rejects uploads above 65536 KiB. Move large bundled JSON to static assets or R2."
            exit 1
          fi
          if awk -v k="$kib" 'BEGIN { exit !(k > 61440) }'; then
            echo "::warning title=Worker bundle size::Upload is ${kib} KiB (soft ceiling 61440 KiB). Still under Cloudflare's 65536 KiB hard limit."
          fi

      - name: Warm edge HTML cache
        # First paint after deploy is the coldest path; prime home/scores/players
        # so colo Cache API + KV fill before the next visitor.
        run: |
          set +e
          BASE="https://drbl.io"
          paths="/ /scores /standings /explore/players /players/3975 /players/1966 /games/401914126"
          echo "### Warm pass 1 (MISS → KV/EDGE)" >> "$GITHUB_STEP_SUMMARY"
          for path in $paths; do
            out=$(curl -sS -o /dev/null -w "%{http_code} ttfb=%{time_starttransfer}s size=%{size_download}" --max-time 90 "${BASE}${path}" 2>&1)
            echo "- \`${path}\`: ${out}" >> "$GITHUB_STEP_SUMMARY"
            echo "warm1 ${path}: ${out}"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Warm pass 2 (promote / verify)" >> "$GITHUB_STEP_SUMMARY"
          for path in / /scores /players/3975 /games/401914126; do
            headers=$(curl -sS -D - -o /dev/null --max-time 60 "${BASE}${path}" 2>&1)
            cache=$(printf '%s\n' "$headers" | grep -i '^x-page-cache:' | tr -d '\r' | head -1)
            echo "- \`${path}\`: ${cache:-no x-page-cache}" >> "$GITHUB_STEP_SUMMARY"
            echo "warm2 ${path}: ${cache:-none}"
          done

      - name: Summary
        if: always()
        run: |
          echo "### Deploy site (code ship)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- ref: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- no daily sync / data refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "- rebakes current-season player game logs + shot charts into Worker assets" >> "$GITHUB_STEP_SUMMARY"
