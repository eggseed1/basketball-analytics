name: Provider parity diagnostic

on:
  push:
    branches:
      - fix/vercel-local-provider-parity
  pull_request:
    branches:
      - main
      - integration/design-main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Probe NBA schedule origins
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          echo '--- cdn schedule ---'
          curl -L --max-time 12 -sS -o /tmp/cdn-schedule.json -w 'status=%{http_code} bytes=%{size_download}\n' \
            -H "User-Agent: $UA" \
            -H 'Accept: application/json, text/plain, */*' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Origin: https://nba.com' \
            -H 'Referer: https://nba.com' \
            -H 'Connection: keep-alive' \
            'https://cdn.nba.com/static/json/staticData/scheduleLeagueV2_1.json'
          head -c 160 /tmp/cdn-schedule.json 2>/dev/null || true
          echo
          echo '--- stats scheduleleaguev2 ---'
          curl -L --max-time 12 -sS -o /tmp/stats-schedule.json -w 'status=%{http_code} bytes=%{size_download}\n' \
            -H "User-Agent: $UA" \
            -H 'Accept: application/json, text/plain, */*' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Origin: https://www.nba.com' \
            -H 'Referer: https://www.nba.com/' \
            -H 'x-nba-stats-origin: stats' \
            -H 'x-nba-stats-token: true' \
            'https://stats.nba.com/stats/scheduleleaguev2?LeagueID=00&Season=2026-27'
          head -c 160 /tmp/stats-schedule.json 2>/dev/null || true
          echo
      - run: npm ci
      - run: npm run build
        env:
          DATA_PROVIDER: nba
          VERCEL: "1"
      - run: node scripts/smoke-built-player-route.mjs
        env:
          DATA_PROVIDER: nba
          VERCEL: "1"
