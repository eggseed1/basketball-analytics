name: Provider parity diagnostic

on:
  push:
    branches:
      - fix/vercel-local-provider-parity
  pull_request:
    branches:
      - main
      - integration/design-main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DATA_PROVIDER: nba
          VERCEL: "1"
      - run: node scripts/smoke-built-player-route.mjs
        env:
          DATA_PROVIDER: nba
          VERCEL: "1"
