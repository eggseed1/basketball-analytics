name: Franchise standings realism audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-gm-standings-realism.ts'
      - 'src/gm/engine/simulate.ts'
      - 'src/gm/engine/game-context.ts'
      - 'src/gm/engine/player-profile.ts'
      - '.github/workflows/franchise-standings-audit.yml'

permissions:
  contents: read

concurrency:
  group: gm-standings-fidelity
  cancel-in-progress: true

jobs:
  standings:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Sim game outcome regression
        run: npm run test:franchise-outcome-realism
      - name: Full real-season standings cohort
        run: npm run audit:franchise-standings
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: franchise-standings-fidelity
          path: |
            artifacts/franchise-standings-realism.json
            artifacts/franchise-standings-realism.md
          if-no-files-found: warn
          retention-days: 60
