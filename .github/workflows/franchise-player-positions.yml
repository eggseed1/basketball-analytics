name: Franchise all-player position audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-gm-positions-2026.ts'
      - '.github/workflows/franchise-player-positions.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Inspect independent 2025-26 Basketball-Reference source workbooks
        run: |
          python -m pip install --quiet openpyxl
          python - <<'PY'
          from io import BytesIO
          from urllib.request import urlopen
          from openpyxl import load_workbook
          url='https://raw.githubusercontent.com/deocheng/nba_data/main/CSV/2025-2026BOS.xlsx'
          with urlopen(url, timeout=35) as r: data=r.read()
          wb=load_workbook(BytesIO(data),read_only=True,data_only=True)
          print('POSITION_WORKBOOK_SHEETS',wb.sheetnames)
          for ws in wb.worksheets:
              ws.reset_dimensions()
              print('POSITION_SHEET',ws.title)
              for idx,row in enumerate(ws.iter_rows(values_only=True)):
                  if idx>=9:break
                  print('POSITION_ROW',repr(list(row[:16])))
          PY
      - name: Compare 2025-26 positional minutes with current ESPN depth charts for every player
        run: npx tsx --require ./scripts/lib/stub-server-only.cjs scripts/audit-gm-positions-2026.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: franchise-all-player-position-evidence
          path: artifacts/gm-player-position-*.json
          if-no-files-found: ignore
          retention-days: 30
