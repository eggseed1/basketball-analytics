name: Franchise rotation multi-season audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-gm-multiseason-rotations.ts'
      - 'src/gm/engine/lineup.ts'
      - 'src/gm/engine/coaching.ts'
      - 'src/gm/engine/rotation-pattern.ts'
      - 'src/gm/engine/rotation-roles.ts'
      - '.github/workflows/franchise-rotation-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Rotation regression tests
        run: npm run test:franchise-rotations
      - name: Run three full NBA schedule cohorts
        run: npm run audit:franchise-rotations
      - name: Publish detailed audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: franchise-rotation-audit
          path: |
            artifacts/franchise-rotation-audit.json
            artifacts/franchise-rotation-audit.md
          if-no-files-found: warn
