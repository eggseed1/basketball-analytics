name: Franchise continuous five-year simulation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/gm/engine/free-agency.ts'
      - 'src/gm/engine/fa-rfa.ts'
      - 'src/gm/engine/fa-utility.ts'
      - 'src/gm/engine/fa-offer-projection.ts'
      - 'src/gm/engine/free-agency-ask.ts'
      - 'scripts/test-gm-free-agency.ts'
      - 'src/gm/engine/dynamic-progression.ts'
      - 'src/gm/engine/development-profile.ts'
      - 'src/gm/engine/development.ts'
      - 'src/gm/engine/attributes.ts'
      - 'src/gm/ui/gm-development.tsx'
      - 'scripts/test-gm-open-development.ts'
      - 'src/gm/engine/trades.ts'
      - 'src/gm/engine/trade-market.ts'
      - 'src/gm/state/gm-store.ts'
      - 'scripts/test-gm-trade-market.ts'
      - 'src/gm/engine/roster-fit.ts'
      - 'src/gm/engine/value.ts'
      - 'src/gm/engine/trade-desk.ts'
      - 'src/app/gm/trade/page.tsx'
      - 'scripts/test-gm-trades.ts'
      - 'scripts/test-gm-trade-fit.ts'
      - '.github/workflows/franchise-five-year.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit-gm-continuous-five-year.ts'
      - 'src/gm/engine/future-schedule.ts'
      - 'src/gm/engine/schedule.ts'
      - 'src/gm/engine/offseason.ts'
      - 'src/gm/engine/season-flow.ts'
      - 'src/gm/engine/free-agency.ts'
      - 'src/gm/engine/progression.ts'
      - 'src/gm/seed/create-league.ts'
      - '.github/workflows/franchise-five-year.yml'
permissions:
  contents: read
concurrency:
  group: franchise-five-year-${{ github.ref }}
  cancel-in-progress: true
jobs:
  longitudinal:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        seed: [42841, 97613]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Five full seasons and four guided summer cycles
        run: npm run audit:franchise-five-year
        env:
          FIVE_YEAR_SEED: ${{ matrix.seed }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: franchise-five-year-continuity-${{ matrix.seed }}
          path: |
            artifacts/franchise-continuous-five-year.json
            artifacts/franchise-continuous-five-year.md
          if-no-files-found: warn
          retention-days: 60
