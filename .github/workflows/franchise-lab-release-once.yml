name: Dispatch Franchise Lab release (one-time)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/franchise-lab-release-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.repository == 'eggseed1/basketball-analytics'
    runs-on: ubuntu-24.04
    steps:
      - name: Start existing Cloudflare deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-site.yml --repo "$GITHUB_REPOSITORY" --ref main
