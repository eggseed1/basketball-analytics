name: Franchise generational careers
on:
  pull_request:
    paths:
      - 'src/gm/engine/development-profile.ts'
      - 'src/gm/engine/dynamic-progression.ts'
      - 'src/gm/engine/career-legacy.ts'
      - 'src/gm/ui/gm-franchise-desk.tsx'
      - 'scripts/audit-gm-generational-careers.ts'
      - 'scripts/test-gm-career-legacy.ts'
      - 'package.json'
      - '.github/workflows/franchise-generational.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: franchise-generational-${{ github.ref }}
  cancel-in-progress: true
jobs:
  historic-talent:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        seed: [3167, 8341, 95421]
    env:
      GENERATIONAL_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Fifty-year draft cohort and elite ceiling realism
        run: npm run audit:franchise-generational
      - name: Validate archive-derived career greatness and save compatibility
        run: npx tsx scripts/test-gm-career-legacy.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: franchise-generational-cohort-${{ matrix.seed }}
          path: /tmp/franchise-generational/careers.json
          retention-days: 30
          if-no-files-found: warn
