name: Cursor runtime parity check

on:
  push:
    branches:
      - fix/restore-cursor-runtime-parity
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_PROVIDER: nba
      VERCEL: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/smoke-runtime-parity.mjs
