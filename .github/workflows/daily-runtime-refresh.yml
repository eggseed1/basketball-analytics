name: Daily player-viz runtime refresh

# Rebuilds Cloudflare-baked snapshots for race tracker + league scatters
# once the NBA tip-off window opens (mid-Oct through Finals). Offseason runs
# still refresh ESPN transactions, which continue through waivers and signings.
# In-season: also recomputes current-season DRBL/WAR1 when the finals count moves.
#
# Precomputed DRBL JSON is not mid-season committed (CI is contents:read).
# Cache + artifacts keep the live season across nights so a soft-fail does not
# wipe yesterday's board and skip-if-unchanged can see prior gamesProcessed.
#
# Transactions, headlines, Reddit scores, the Movement Center, sentiment,
# payrolls, front-office slices and the asset ledger are committed back to
# main after each sync. RSS feeds only carry the last day or two, so the
# headline store has to persist between runs, and committing keeps a manual
# deploy from an up-to-date checkout from rolling the data back.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   — Workers deploy token
#   CLOUDFLARE_ACCOUNT_ID  — account id for wrangler / OpenNext
# Optional (fan sentiment lane; each source is skipped when unset):
#   REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET  — Reddit app credentials (needs Reddit API approval)
#   vars.REDDIT_USER_AGENT                  — repo variable, not a secret
#   YOUTUBE_API_KEY                         — Google Cloud key with YouTube Data API v3
#   vars.BLUESKY_HANDLE, BLUESKY_APP_PASSWORD — only if logged-out Bluesky search stops working
#   CLOUDFLARE_AI_TOKEN                     — token with only Workers AI permission; rates headline,
#                                             Bluesky and YouTube tone per player (word-list scores
#                                             are used without it)
# Fan blogs need nothing.

on:
  schedule:
    # ~7:15 America/New_York during EST; after most overnight finals settle.
    # Off the top of the hour, where GitHub drops the most scheduled runs.
    - cron: "17 12 * * *"
    # Backups for days GitHub skips the run or no runner picks it up. The
    # guard job turns them into no-ops once a run has succeeded that UTC day.
    - cron: "17 16 * * *"
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync + deploy even in offseason"
        type: boolean
        default: false
      deploy:
        description: "Deploy to Cloudflare after sync"
        type: boolean
        default: true

concurrency:
  group: daily-runtime-refresh
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip scheduled backups after a successful run today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%F)
          count=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-runtime-refresh.yml/runs?status=success&created=${today}&per_page=1" --jq '.total_count')
          echo "successful runs on ${today} (UTC): ${count}"
          if [ "${count}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Full DRBL season refit + overlay + OpenNext can exceed 3h on cold cache.
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      DATA_PROVIDER: nba
      FULL_EDGE_PRODUCT: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      FORCE_DAILY: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve season
        id: season
        run: |
          node --input-type=module -e "
            import { nbaSeasonPhaseInfo } from './scripts/lib/nba-season-phase.mjs';
            const info = nbaSeasonPhaseInfo(new Date());
            const fs = await import('node:fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, \`season=\${info.season}\nphase=\${info.phase}\n\`);
            console.log(info);
          "

      - name: Cache DRBL raw responses
        uses: actions/cache@v4
        with:
          path: data/drbl/raw
          key: drbl-raw-${{ runner.os }}-${{ steps.season.outputs.season }}-${{ github.run_id }}
          restore-keys: |
            drbl-raw-${{ runner.os }}-${{ steps.season.outputs.season }}-
            drbl-raw-${{ runner.os }}-

      - name: Cache DRBL precomputed (live season only)
        uses: actions/cache@v4
        with:
          # Only the current season file — never restore the whole precomputed/
          # tree or a stale cache can overwrite sealed historical JSON from git.
          path: src/data/drbl/precomputed/${{ steps.season.outputs.season }}.json
          key: drbl-precomputed-${{ runner.os }}-${{ steps.season.outputs.season }}-${{ github.run_id }}
          restore-keys: |
            drbl-precomputed-${{ runner.os }}-${{ steps.season.outputs.season }}-

      # Spotrac future picks are read in headless Chromium.
      - name: Playwright Chromium
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # stats.nba.com stalls non-browser TLS clients; curl_cffi mimics Chrome.
      # Soft-fails so a blocked runner keeps the committed snapshot.
      - name: Play types, on/off and league shot zones
        continue-on-error: true
        timeout-minutes: 20
        run: |
          pip install --quiet curl_cffi
          python scripts/build-runtime-playtype-onoff-snapshot.py "${{ steps.season.outputs.season }}"

      - name: Daily runtime sync
        id: sync
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/daily-runtime-sync.mjs

      - name: Commit refreshed data
        if: steps.sync.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/sentiment/ingest/v1 \
            data/sentiment/v1/snapshot.json \
            src/data/runtime/sentiment-snapshot.json \
            public/runtime/sentiment-history \
            data/movement-center/v1/snapshot.json \
            src/data/runtime/movement-snapshot.json \
            data/transactions/espn-site-v2/v1 \
            data/transactions/nba-player-movement/v1 \
            data/transactions/espn-draft/v1 \
            src/data/runtime/draft-night-snapshot.json \
            src/data/runtime/draft-history-snapshot.json \
            src/data/runtime/transactions-snapshot.json \
            src/data/runtime/bref-team-contracts-snapshot.json \
            src/data/runtime/contract-value-snapshot.json \
            data/salary-payoff/nightly \
            src/data/runtime/salary-payoff-snapshot.json \
            data/front-office/v1 \
            src/data/runtime/front-office-snapshot.json \
            data/asset-ledger/v1 \
            src/data/runtime/asset-ledger-snapshot.json \
            src/data/runtime/team-leadership.json \
            src/data/runtime/player-awards-snapshot.json \
            data/draft-picks/spotrac/v1 \
            src/data/runtime/future-picks-snapshot.json \
            src/data/runtime/player-bio-snapshot.json \
            src/data/runtime/draft-year-snapshot.json \
            src/data/franchises/verified-records.json \
            data/impact/player-id-aliases.json \
            src/data/runtime/player-id-aliases-snapshot.json \
            src/data/media/portrait-lookup.json \
            data/salaries/player-salaries-bref-archive.csv \
            data/cba/league-cap-seasons.json \
            data/cba/salary-cap-by-year.json \
            src/content/awards/retired-jerseys.json \
            src/data/runtime/hof-inductees-snapshot.json \
            src/data/runtime/play-type-snapshot.json \
            src/data/runtime/on-off-snapshot.json \
            src/data/runtime/team-game-box-snapshot.json \
            public/runtime/on-off
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Nightly data refresh [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 10))
          done
          echo "::warning::Could not push the data refresh; the deploy still uses it."

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-runtime-sync
          path: artifacts/daily-runtime-sync.json
          if-no-files-found: ignore

      - name: Upload DRBL season artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drbl-precomputed-${{ steps.season.outputs.season }}
          path: |
            src/data/drbl/precomputed/${{ steps.season.outputs.season }}.json
            src/data/runtime/drbl-published-seasons.json
            src/data/runtime/drbl-overlay-snapshot.json
          if-no-files-found: ignore

      - name: Build OpenNext bundle
        if: >-
          steps.sync.outputs.should_deploy == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.deploy)
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare
        if: >-
          steps.sync.outputs.should_deploy == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing deploy token::The CLOUDFLARE_API_TOKEN repo secret is empty. Set it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          npx opennextjs-cloudflare deploy

      - name: Check Movement Center freshness
        if: always() && steps.sync.outcome != 'skipped'
        run: node scripts/check-movement-freshness.mjs

      - name: Summary
        if: always()
        run: |
          echo "### Daily player-viz refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- phase: \`${{ steps.sync.outputs.phase }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- season: \`${{ steps.sync.outputs.season }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- skipped: \`${{ steps.sync.outputs.skipped }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- should_deploy: \`${{ steps.sync.outputs.should_deploy }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/daily-runtime-sync.json ]; then
            node -e "const r=require('./artifacts/daily-runtime-sync.json');console.log('- soft-failed: \`'+((r.softFailed||[]).join(', ')||'none')+'\`');console.log('- movement steps: \`'+((r.movement&&r.movement.done)||[]).join(', ')+'\`')" >> "$GITHUB_STEP_SUMMARY"
          fi
