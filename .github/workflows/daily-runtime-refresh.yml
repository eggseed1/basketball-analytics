name: Daily player-viz runtime refresh

# Nightly data sync (+ deploy). For a code-only ship, use deploy-site.yml
# instead — this workflow always runs the full runtime sync.
#
# Rebuilds Cloudflare-baked snapshots for race tracker + league scatters
# once the NBA tip-off window opens (mid-Oct through Finals). Offseason runs
# still refresh ESPN transactions, which continue through waivers and signings.
# In-season: also recomputes current-season DRBL/WAR1 when the finals count moves.
#
# Precomputed DRBL JSON is not mid-season committed (CI is contents:read).
# Cache + artifacts keep the live season across nights so a soft-fail does not
# wipe yesterday's board and skip-if-unchanged can see prior gamesProcessed.
#
# Transactions, headlines, Reddit scores, the Movement Center, sentiment,
# payrolls, front-office slices and the asset ledger are committed back to
# main after each sync. RSS feeds only carry the last day or two, so the
# headline store has to persist between runs, and committing keeps a manual
# deploy from an up-to-date checkout from rolling the data back.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   — Workers deploy token
#   CLOUDFLARE_ACCOUNT_ID  — account id for wrangler / OpenNext
# Optional (fan sentiment lane; each source is skipped when unset):
#   REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET  — Reddit app credentials (needs Reddit API approval)
#   vars.REDDIT_USER_AGENT                  — repo variable, not a secret
#   YOUTUBE_API_KEY                         — Google Cloud key with YouTube Data API v3
#   vars.BLUESKY_HANDLE, BLUESKY_APP_PASSWORD — only if logged-out Bluesky search stops working
#   SENTIMENT_ID_KEY                        — HMAC key for stored Bluesky and YouTube ids; both
#                                             ingests fail without it (openssl rand -hex 32)
#   CLOUDFLARE_AI_TOKEN                     — token with only Workers AI permission; rates headline,
#                                             Bluesky and YouTube tone per player (word-list scores
#                                             are used without it)
# Fan blogs need nothing.

on:
  schedule:
    # Two shots/day is enough when the guard works. Extra crons mostly burned
    # GitHub minutes and, on success, re-deployed / re-mirrored R2 for free.
    # Times are UTC; comments are America/New_York during EDT (UTC-4).
    #
    # After West Coast finals settle (~6:37am ET).
    - cron: "37 10 * * *"
    # Midday backup if the morning run failed (~12:17pm ET).
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync + deploy even in offseason"
        type: boolean
        default: false
      deploy:
        description: "Deploy to Cloudflare after sync"
        type: boolean
        default: true
      commit_season:
        description: "Also commit heavy in-season bakes (season-tables/DRBL/impact/etc.). Standings+game-snapshot already commit on tip-window mornings."
        type: boolean
        default: false

concurrency:
  group: daily-runtime-refresh
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      # Only skip when a real refresh job already finished today after the
      # post-finals cutoff. Guard-only "success" no-ops and early pre-tip syncs
      # must not block later crons (that left last night's games stale).
      - name: Skip scheduled backups after a post-finals refresh today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # 08:00 UTC ≈ 4am ET. West Coast finals are usually in by then.
          POST_FINALS_UTC_HOUR: "8"
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          today=$(date -u +%F)
          repo="${{ github.repository }}"
          cutoff_hour="${POST_FINALS_UTC_HOUR}"
          echo "looking for refresh success on ${today} UTC at/after ${cutoff_hour}:00Z"

          mapfile -t run_ids < <(
            gh api "repos/${repo}/actions/workflows/daily-runtime-refresh.yml/runs?status=success&created=${today}&per_page=30" \
              --jq '.workflow_runs[].id'
          )
          echo "candidate successful workflow runs: ${#run_ids[@]}"

          found=""
          for id in "${run_ids[@]}"; do
            [ -n "$id" ] || continue
            # Exclude this in-flight run if it somehow appears.
            if [ "$id" = "${{ github.run_id }}" ]; then
              continue
            fi
            completed=$(
              gh api "repos/${repo}/actions/runs/${id}/jobs?per_page=20" \
                --jq '[.jobs[] | select(.name == "refresh" and .conclusion == "success") | .completed_at] | first // empty'
            )
            if [ -z "$completed" ]; then
              echo "run ${id}: no successful refresh job (guard-only or failed refresh)"
              continue
            fi
            hour=$(date -u -d "$completed" +%H 2>/dev/null || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "$completed" +%H)
            echo "run ${id}: refresh completed ${completed} (hour=${hour}Z)"
            if [ "$hour" -ge "$cutoff_hour" ]; then
              found="$id"
              break
            fi
            echo "run ${id}: before post-finals cutoff — not enough to skip later crons"
          done

          if [ -n "$found" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skipping: refresh already succeeded post-finals in run ${found}"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "running: no post-finals refresh success yet today"
          fi

  refresh:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    # Full DRBL season refit + overlay + OpenNext can exceed 3h on cold cache.
    timeout-minutes: 300
    permissions:
      contents: write
      # Read deploy-site history so we never rebuild main over a newer code ship.
      actions: read
    env:
      DATA_PROVIDER: nba
      FULL_EDGE_PRODUCT: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      FORCE_DAILY: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve season
        id: season
        run: |
          node --input-type=module -e "
            import { nbaSeasonPhaseInfo } from './scripts/lib/nba-season-phase.mjs';
            const info = nbaSeasonPhaseInfo(new Date());
            const fs = await import('node:fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, \`season=\${info.season}\nphase=\${info.phase}\n\`);
            console.log(info);
          "

      - name: Cache DRBL raw responses
        uses: actions/cache@v4
        with:
          path: data/drbl/raw
          key: drbl-raw-${{ runner.os }}-${{ steps.season.outputs.season }}-${{ github.run_id }}
          restore-keys: |
            drbl-raw-${{ runner.os }}-${{ steps.season.outputs.season }}-
            drbl-raw-${{ runner.os }}-

      - name: Cache DRBL precomputed (live season only)
        uses: actions/cache@v4
        with:
          # Only the current season file — never restore the whole precomputed/
          # tree or a stale cache can overwrite sealed historical JSON from git.
          path: src/data/drbl/precomputed/${{ steps.season.outputs.season }}.json
          key: drbl-precomputed-${{ runner.os }}-${{ steps.season.outputs.season }}-${{ github.run_id }}
          restore-keys: |
            drbl-precomputed-${{ runner.os }}-${{ steps.season.outputs.season }}-

      # Spotrac future picks are read in headless Chromium.
      - name: Playwright Chromium
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # stats.nba.com stalls non-browser TLS clients; curl_cffi mimics Chrome.
      # Soft-fails so a blocked runner keeps the committed snapshot.
      - name: Play types, on/off and league shot zones
        continue-on-error: true
        timeout-minutes: 20
        run: |
          pip install --quiet curl_cffi
          python scripts/build-runtime-playtype-onoff-snapshot.py "${{ steps.season.outputs.season }}"

      - name: Daily runtime sync
        id: sync
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SENTIMENT_ID_KEY: ${{ secrets.SENTIMENT_ID_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/daily-runtime-sync.mjs

      - name: Commit refreshed data
        if: steps.sync.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/sentiment/ingest/v1 \
            data/sentiment/v1/snapshot.json \
            src/data/runtime/sentiment-snapshot.json \
            public/runtime/sentiment-history \
            data/movement-center/v1/snapshot.json \
            src/data/runtime/movement-snapshot.json \
            data/transactions/espn-site-v2/v1 \
            data/transactions/nba-player-movement/v1 \
            data/transactions/espn-draft/v1 \
            src/data/runtime/draft-night-snapshot.json \
            src/data/runtime/draft-history-snapshot.json \
            src/data/runtime/transactions-snapshot.json \
            src/data/runtime/bref-team-contracts-snapshot.json \
            src/data/runtime/contract-value-snapshot.json \
            data/salary-payoff/nightly \
            src/data/runtime/salary-payoff-snapshot.json \
            data/front-office/v1 \
            src/data/runtime/front-office-snapshot.json \
            data/asset-ledger/v1 \
            src/data/runtime/asset-ledger-snapshot.json \
            src/data/runtime/team-leadership.json \
            src/data/runtime/player-awards-snapshot.json \
            data/draft-picks/spotrac/v1 \
            src/data/runtime/future-picks-snapshot.json \
            src/data/runtime/player-bio-snapshot.json \
            src/data/runtime/draft-year-snapshot.json \
            src/data/franchises/verified-records.json \
            data/impact/player-id-aliases.json \
            src/data/runtime/player-id-aliases-snapshot.json \
            src/data/media/portrait-lookup.json \
            data/salaries/player-salaries-bref-archive.csv \
            data/cba/league-cap-seasons.json \
            data/cba/salary-cap-by-year.json \
            src/content/awards/retired-jerseys.json \
            data/movement-center/trade-deadlines.json \
            public/runtime/arcade/league-seasons.json \
            src/data/runtime/findings-archive.json \
            data/ops/step-health.json \
            data/ops/seasonal-upkeep.json \
            src/data/runtime/hustle-overlay-snapshot.json \
            src/data/runtime/play-type-snapshot.json \
            src/data/runtime/on-off-snapshot.json \
            src/data/runtime/team-game-box-snapshot.json \
            public/runtime/on-off
          # Lightweight boards every tip-window morning (W-L after last night).
          # Cloudflare serves bundled standings first — Monday-only commits froze
          # records all week without any Worker ESPN savings left to reclaim.
          if [ "${{ steps.sync.outputs.commit_board }}" = "true" ] || [ "${{ steps.sync.outputs.commit_season }}" = "true" ] || [ "${{ github.event.inputs.commit_season }}" = "true" ]; then
            git add -- \
              src/data/runtime/game-snapshot.json \
              src/data/runtime/standings-snapshot.json
          fi
          # Heavy in-season bakes, Mondays and after the Finals by default.
          # workflow_dispatch can force a mid-week season commit via commit_season=true.
          if [ "${{ steps.sync.outputs.commit_season }}" = "true" ] || [ "${{ github.event.inputs.commit_season }}" = "true" ]; then
            git add -- \
              src/data/runtime/season-tables-snapshot.json \
              src/data/runtime/team-board-snapshot.json \
              src/data/runtime/current-roster-snapshot.json \
              src/data/runtime/drbl-overlay-snapshot.json \
              src/data/runtime/drbl-published-seasons.json \
              src/data/runtime/drbl-guide-snapshot.json \
              src/data/runtime/impact-overlay-snapshot.json \
              src/data/runtime/percentile-pools-snapshot.json \
              src/data/runtime/player-search-snapshot.json \
              src/data/runtime/espn-name-index.json \
              src/data/runtime/stat-detective-windows.json \
              src/data/runtime/recent-insights-snapshot.json \
              src/data/drbl/precomputed
          fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Nightly data refresh [skip ci]"
          # Leftover dirty trees (e.g. season bakes when commit_season=false)
          # block pull --rebase; stash them so the nightly commit can push,
          # then restore for the OpenNext deploy that follows.
          git stash push -u -m "daily-refresh: unstaged bake leftovers" || true
          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=1
              break
            fi
            sleep $((attempt * 10))
          done
          git stash pop || true
          if [ "$pushed" != "1" ]; then
            echo "::warning::Could not push the data refresh; the deploy still uses it."
          fi

      # Current season is mirrored to R2 every night so a code-only deploy-site
      # that somehow skips the asset bake still has a store fallback
      # (player-game-logs-store / player-shots-store read R2 when ASSETS miss).
      # Current season already ships in Worker ASSETS on deploy. Nightly R2
      # re-PUT of ~1.5k objects was Class A + rate-limit sleep with no product
      # gain on a normal day. Keep a weekly safety mirror with season commits
      # (Mondays / forced commit_season), plus the Finals archive step below.
      - name: Mirror current-season game logs to R2
        if: >-
          steps.sync.outputs.should_deploy == 'true' &&
          (steps.sync.outputs.commit_season == 'true' || github.event.inputs.commit_season == 'true')
        continue-on-error: true
        timeout-minutes: 25
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEASONS: ${{ steps.sync.outputs.season }}
        run: node scripts/upload-player-game-logs-r2.mjs

      - name: Mirror current-season shot charts to R2
        if: >-
          steps.sync.outputs.should_deploy == 'true' &&
          (steps.sync.outputs.commit_season == 'true' || github.event.inputs.commit_season == 'true')
        continue-on-error: true
        timeout-minutes: 25
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEASONS: ${{ steps.sync.outputs.season }}
        run: |
          # Stay under the account-wide 1,200 writes / 5 min ceiling when the
          # game-log mirror above just finished a large batch.
          sleep 320
          node scripts/upload-player-shots-r2.mjs

      # After the Finals (June 25-30), also archive the closing season's game
      # files. Logs + shots for that season are already mirrored above; this
      # step re-uploads them with the game archive before offseason deploys
      # stop baking the finished year into Worker assets.
      - name: Archive season game logs, shots and games to R2
        if: steps.sync.outputs.archive_season == 'true'
        continue-on-error: true
        timeout-minutes: 75
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEASONS: ${{ steps.sync.outputs.season }}
        run: |
          node scripts/upload-player-game-logs-r2.mjs
          # Cloudflare allows 1,200 API calls per 5 minutes across the account.
          sleep 320
          node scripts/upload-player-shots-r2.mjs
          sleep 320
          # Box scores and play-by-play the DRBL recompute cached for the season.
          ONLY=games node scripts/upload-game-archive-r2.mjs
          sleep 320

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-runtime-sync
          path: artifacts/daily-runtime-sync.json
          if-no-files-found: ignore

      - name: Upload DRBL season artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drbl-precomputed-${{ steps.season.outputs.season }}
          path: |
            src/data/drbl/precomputed/${{ steps.season.outputs.season }}.json
            src/data/runtime/drbl-published-seasons.json
            src/data/runtime/drbl-overlay-snapshot.json
          if-no-files-found: ignore

      # Code ships via deploy-site.yml (often from a feature branch). This nightly
      # job checks out main for data sync/commits. Rebuilding OpenNext from main
      # would wipe that Worker. When the latest successful deploy-site SHA is not
      # already contained in this checkout, build/deploy from that SHA and overlay
      # the freshly synced runtime assets so data still updates.
      - name: Align Worker tree with latest code ship
        id: worker_tree
        if: >-
          steps.sync.outputs.should_deploy == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHIP_SHA=$(gh run list --workflow=deploy-site.yml --status success --limit 1 \
            --json headSha,headBranch,databaseId,createdAt \
            --jq '.[0].headSha // empty')
          SHIP_BRANCH=$(gh run list --workflow=deploy-site.yml --status success --limit 1 \
            --json headBranch --jq '.[0].headBranch // empty')
          if [ -z "$SHIP_SHA" ]; then
            echo "mode=checkout" >> "$GITHUB_OUTPUT"
            echo "No prior deploy-site success; deploying this checkout as-is."
            exit 0
          fi
          if git merge-base --is-ancestor "$SHIP_SHA" HEAD 2>/dev/null; then
            echo "mode=checkout" >> "$GITHUB_OUTPUT"
            echo "Latest deploy-site ${SHIP_SHA:0:8} ($SHIP_BRANCH) is contained in HEAD; deploying this checkout."
            exit 0
          fi
          echo "Latest deploy-site ${SHIP_SHA:0:8} ($SHIP_BRANCH) is NOT in this checkout — preserving that Worker code and overlaying nightly assets."
          mkdir -p /tmp/tm
          tar -czf /tmp/tm/nightly-runtime-overlay.tgz \
            --ignore-failed-read \
            public/runtime \
            src/data/runtime \
            src/data/drbl/precomputed \
            data/sentiment \
            data/movement-center \
            data/transactions \
            data/asset-ledger 2>/dev/null || \
          tar -czf /tmp/tm/nightly-runtime-overlay.tgz public/runtime
          git fetch origin "$SHIP_SHA" --depth=1
          git checkout --force "$SHIP_SHA"
          tar -xzf /tmp/tm/nightly-runtime-overlay.tgz
          echo "mode=ship-sha" >> "$GITHUB_OUTPUT"
          echo "ship_sha=$SHIP_SHA" >> "$GITHUB_OUTPUT"
          echo "ship_branch=$SHIP_BRANCH" >> "$GITHUB_OUTPUT"
          echo "### Worker tree" >> "$GITHUB_STEP_SUMMARY"
          echo "- deploy-site SHA preserved: \`${SHIP_SHA}\` (\`${SHIP_BRANCH}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- nightly runtime assets overlaid onto that tree before OpenNext build" >> "$GITHUB_STEP_SUMMARY"

      - name: Share images
        if: >-
          steps.sync.outputs.should_deploy == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.deploy)
        continue-on-error: true
        run: npx tsx --require ./scripts/lib/stub-server-only.cjs scripts/build-share-images.ts

      - name: Build OpenNext bundle
        if: >-
          steps.sync.outputs.should_deploy == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.deploy)
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare
        if: >-
          steps.sync.outputs.should_deploy == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing deploy token::The CLOUDFLARE_API_TOKEN repo secret is empty. Set it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          set -o pipefail
          bash scripts/deploy-cf-workers.sh

      # Cloudflare rejects Workers over 64 MiB uncompressed (wrangler's "Total Upload").
      # Soft warn past 60 MiB; only fail when we are within ~1 MiB of the hard cap so a
      # successful deploy is not marked red for headroom alone.
      - name: Check Worker size
        if: always()
        run: |
          log=/tmp/deploy-origin.log
          [ -f "$log" ] || log=/tmp/deploy.log
          [ -f "$log" ] || exit 0
          kib=$(grep -oE 'Total Upload: [0-9.]+ KiB' "$log" | head -1 | grep -oE '[0-9.]+' || true)
          [ -n "$kib" ] || exit 0
          echo "Origin Worker upload: ${kib} KiB of 65536 KiB"
          if awk -v k="$kib" 'BEGIN { exit !(k > 64512) }'; then
            echo "::error title=Worker bundle near the 64 MiB limit::Upload is ${kib} KiB; Cloudflare rejects uploads above 65536 KiB. Move large bundled JSON to static assets or R2."
            exit 1
          fi
          if awk -v k="$kib" 'BEGIN { exit !(k > 61440) }'; then
            echo "::warning title=Worker bundle size::Upload is ${kib} KiB (soft ceiling 61440 KiB). Still under Cloudflare's 65536 KiB hard limit."
          fi

      - name: Check Movement Center freshness
        if: always() && steps.sync.outcome != 'skipped'
        run: node scripts/check-movement-freshness.mjs

      - name: Check nightly step health
        if: always() && steps.sync.outcome != 'skipped'
        run: node scripts/check-step-health.mjs

      - name: Check R2 write access
        if: always() && steps.sync.outcome != 'skipped'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-r2-write.mjs

      - name: Summary
        if: always()
        run: |
          echo "### Daily player-viz refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- phase: \`${{ steps.sync.outputs.phase }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- season: \`${{ steps.sync.outputs.season }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- skipped: \`${{ steps.sync.outputs.skipped }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- should_deploy: \`${{ steps.sync.outputs.should_deploy }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/daily-runtime-sync.json ]; then
            node -e "const r=require('./artifacts/daily-runtime-sync.json');console.log('- soft-failed: \`'+((r.softFailed||[]).join(', ')||'none')+'\`');console.log('- movement steps: \`'+((r.movement&&r.movement.done)||[]).join(', ')+'\`')" >> "$GITHUB_STEP_SUMMARY"
          fi
