name: Protect live NBA snapshots from stale code merges
on:
  push:
    branches: [main]
    paths:
      - 'src/data/runtime/standings-snapshot.json'
      - 'src/data/runtime/game-snapshot.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: protect-live-nba-snapshots
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify guard regressions
        run: node --test scripts/test-live-runtime-guard.mjs
      - name: Restore newer nightly results if a merge rewound NBA data
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/protect-live-runtime.mjs --repair
      - name: Commit and deploy repaired data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/runtime/standings-snapshot.json src/data/runtime/game-snapshot.json; then
            echo "Live NBA boards are fresh; no repair necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/data/runtime/standings-snapshot.json src/data/runtime/game-snapshot.json
          git commit -m "Restore live NBA records after stale snapshot merge [skip ci]"
          git push origin HEAD:main
          gh workflow run deploy-site.yml --ref main
