name: Franchise Lab
on:
  push:
    branches: [main]
    paths:
      - 'src/gm/**'
      - 'src/app/gm/**'
      - 'scripts/*gm*'
      - 'scripts/test-franchise-systems.mjs'
      - 'package.json'
      - '.github/workflows/franchise-lab.yml'
  pull_request:
    paths:
      - 'src/gm/**'
      - 'src/app/gm/**'
      - 'scripts/*gm*'
      - 'scripts/test-franchise-systems.mjs'
      - 'package.json'
      - '.github/workflows/franchise-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: franchise-lab-gameplay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulation:
    runs-on: ubuntu-24.04
    # The expanded lottery / market / development audit matrix needs more
    # than 15 minutes under parallel CI load. Keep per-script timeouts in
    # scripts/run-tests.mjs; this guards the entire sequential gameplay job.
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npx eslint src/gm src/app/gm scripts/test-gm-franchise-upgrade.ts scripts/test-gm-calibration.ts scripts/test-franchise-systems.mjs scripts/fixture-gm-franchise.ts scripts/smoke-gm-browser.mjs scripts/test-gm-draft-overhaul.ts scripts/test-gm-draft-class.ts scripts/fixture-gm-draft-overhaul.ts scripts/smoke-gm-draft-overhaul.mjs --quiet --pass-on-unpruned-suppressions
      - run: npx tsx scripts/test-gm-trade-market.ts
      - run: npm run test:franchise-rotations
      - run: npm run test:franchise-postseason
      - run: npm run test:franchise-calibration
      - run: npm run test:franchise-badges
      - run: npm run test:franchise-offseason-market-lottery
      - run: npm run test:franchise-social
      - run: npm run test:franchise-generated-identity
      - run: npm run test:franchise-generated-jersey
      - run: npm run test:franchise-media
      - run: npm run test:franchise-development
      - run: npm run test:franchise-skill-bundles-camp
      - run: npm run test:franchise-front-office-polish
      - run: npm run test:franchise-mentorship-open-path
      - run: npm run test:franchise-dynamic-progression
      - run: npm run test:franchise-tendencies
      - run: npm run test:franchise-value-coverage
      - run: npm run test:franchise-generated-star-parity
      - run: npx tsx scripts/test-gm-open-development.ts
      - run: npm run test:franchise-calendar
      - run: npm run test:franchise-flow
      - name: Six-season free-agency offer and acceptance audit
        run: npx tsx scripts/test-gm-free-agency.ts
      - run: npm run test:franchise-ux
      - run: npm run test:franchise-saves
      - run: npm run test:franchise-draft
      - run: npm run test:franchise-draft-accessibility
      - run: npm run test:franchise-scout-desk
      - run: npm run test:franchise-lab
      - run: npm run test:franchise-systems
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: franchise-lab-calibration
          path: |
            /tmp/franchise-calibration
            /tmp/franchise-draft-calibration
          if-no-files-found: ignore
          retention-days: 7
  balance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:franchise-multiseason
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: franchise-long-horizon-balance
          path: /tmp/franchise-calibration/multiseason.json
          if-no-files-found: ignore
          retention-days: 7
  fidelity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:franchise-possession-fidelity
      - run: npm run test:franchise-sim-holdout
      - run: npm run test:franchise-outcome-realism
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: franchise-possession-fidelity
          path: /tmp/franchise-calibration/possession-fidelity.json
          if-no-files-found: ignore
          retention-days: 7
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/visualize-gm-generated-jerseys.ts
      - run: node scripts/smoke-react-state.mjs
      - run: node scripts/smoke-gm-browser.mjs
      - run: node --require ./scripts/lib/stub-server-only.cjs --import tsx scripts/smoke-gm-postseason.mjs
      - run: node scripts/audit-gm-ux.mjs --verify
      - run: node scripts/smoke-gm-draft-overhaul.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: franchise-lab-ui
          path: |
            /tmp/franchise-qa
            /tmp/franchise-postseason
            /tmp/franchise-ux
            /tmp/franchise-draft-qa
          retention-days: 7
