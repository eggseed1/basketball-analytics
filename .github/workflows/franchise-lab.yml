name: Franchise Lab
on:
  pull_request:
    paths:
      - 'src/gm/**'
      - 'src/app/gm/**'
      - 'scripts/*gm*'
      - 'scripts/test-franchise-systems.mjs'
      - 'package.json'
      - '.github/workflows/franchise-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: franchise-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npx eslint src/gm src/app/gm scripts/test-gm-franchise-upgrade.ts scripts/test-gm-calibration.ts scripts/test-franchise-systems.mjs scripts/fixture-gm-franchise.ts scripts/smoke-gm-browser.mjs --quiet --pass-on-unpruned-suppressions
      - run: npm run test:franchise-flow
      - run: npm run test:franchise-lab
      - run: npm run test:franchise-systems
      - run: npm run test:franchise-calibration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: franchise-lab-calibration
          path: /tmp/franchise-calibration
          if-no-files-found: ignore
          retention-days: 7
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-react-state.mjs
      - run: node scripts/smoke-gm-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: franchise-lab-ui
          path: /tmp/franchise-qa
          retention-days: 7
